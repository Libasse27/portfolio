# Environnement de développement conteneurisé (MODULE 16.1, PHASE 7) —
# alternative à `pnpm dev` en local, utile pour reproduire un environnement
# Linux/Node identique à la CI. Lancer depuis la racine du monorepo :
#   docker compose -f docker/compose/docker-compose.dev.yml up
services:
  web:
    build:
      context: ../..
      dockerfile: docker/development/Dockerfile
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: 'true' # rechargement fiable sur les volumes montés (Windows/macOS)
    env_file:
      # Optionnel : apps/web/.env.local n'est pas versionné (secrets locaux).
      # SITE_URL a une valeur par défaut (apps/web/.env.example) sans lui.
      - path: ../../apps/web/.env.local
        required: false
    volumes:
      - ../..:/app
      # Volumes anonymes : préservent le node_modules installé *dans* l'image
      # plutôt que de le faire écraser par le bind mount du code hôte.
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/apps/web/.next
