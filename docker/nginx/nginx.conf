# Reverse proxy pour la voie auto-hébergée (docker-compose.prod.yml) — alternative
# à Vercel (docs/14-Deployment/README.md). Les en-têtes de sécurité (CSP, HSTS…)
# sont déjà posés par Next.js (apps/web/next.config.ts) : pas de duplication ici,
# ce fichier ne fait que terminer les connexions et relayer vers le conteneur web.
#
# TLS non configuré (pas de nom de domaine ni de certificat réels acquis à ce
# jour — voir README, § État du projet). À ajouter avant toute mise en
# production auto-hébergée : bloc `listen 443 ssl`, certificats (Let's Encrypt/
# certbot), redirection 80 → 443.

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  gzip          on;
  gzip_types    text/css application/javascript application/json image/svg+xml;

  upstream web_upstream {
    server web:3000;
    keepalive 32;
  }

  server {
    listen 80;
    server_name _;

    client_max_body_size 2m;

    location / {
      proxy_pass http://web_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection '';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
